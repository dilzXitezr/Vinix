<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>X-FAR V13.2 PREMIUM - DILZNOELZ</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
<style>
*{font-family:'Poppins',sans-serif;box-sizing:border-box}
body{margin:0;background:#080b1a;color:#fff;min-height:100vh}
.bg{position:fixed;inset:0;background:radial-gradient(circle at 50% 0%,#1a2a5a,#080b1a);z-index:-1}
.header{padding:12px;display:flex;justify-content:space-between;align-items:center;background:#000a;border-bottom:1px solid #ffffff15;position:sticky;top:0;z-index:50}
.phones{display:flex;gap:16px;justify-content:center;padding:16px;flex-wrap:wrap}
.phone{width:300px;background:linear-gradient(180deg,#121a36,#0a0e1f);border-radius:30px;border:3px solid #2a3f8a;box-shadow:0 0 30px #3a5aff55;padding:10px}
.phone.mid{border-color:#5a7aff;box-shadow:0 0 40px #5a7aff88;transform:scale(1.03)}
.topbar{display:flex;justify-content:space-between;padding:6px;font-size:10px}
.topbar b{background:#fff;color:#000;padding:4px 12px;border-radius:20px;font-family:'Orbitron'}
.box{background:linear-gradient(135deg,#d8e2ff,#8aa0ff);color:#000;border-radius:16px;padding:10px;cursor:pointer}
.box.dark{background:linear-gradient(135deg,#1e2d6a,#3a5aff);color:#fff}
.num{font-family:'Orbitron';font-size:22px;font-weight:800}.label{font-size:8px;font-weight:700}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.tool{background:#ffffff12;border:1px solid #ffffff18;border-radius:12px;padding:10px 4px;text-align:center;cursor:pointer}
.tool b{font-size:7px;display:block}
#popup{position:fixed;inset:0;background:#000b;backdrop-filter:blur(12px);display:none;place-items:center;z-index:999;padding:16px}
#popup.show{display:grid}
.card{background:linear-gradient(180deg,#1a2347,#121832);border:1px solid #4a6aff88;border-radius:24px;padding:18px;width:100%;max-width:360px;box-shadow:0 0 50px #4a6aff55}
.head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.iconBox{width:52px;height:52px;background:linear-gradient(135deg,#4a7aff,#2a4aff);border-radius:14px;display:grid;place-items:center;font-size:26px}
.card h3{margin:0;font-family:'Orbitron';font-size:15px}
.card p{margin:2px 0 0;font-size:10px;opacity:.6}
.input{width:100%;background:#0006;border:1px solid #ffffff22;border-radius:12px;padding:12px;color:#fff;font-size:12px;margin:8px 0;outline:none}
.btn-exec{width:100%;background:linear-gradient(90deg,#4a7aff,#2a4aff);color:#fff;border:none;padding:12px;border-radius:12px;font-weight:800;cursor:pointer;margin-top:6px}
.btn-close{width:100%;background:#fff;color:#000;border:none;padding:10px;border-radius:12px;font-weight:800;cursor:pointer;margin-top:8px}
.result{background:#0006;border:1px dashed #4a7aff55;border-radius:12px;padding:10px;margin-top:10px;font-size:11px;display:none}
</style>
</head>
<body>
<div class="bg"></div>
<div class="header"><b>X-FAR × <span style="color:#5a7aff">DILZNOELZ V13.2</span></b><button style="background:#fff;color:#000;border:none;padding:6px 12px;border-radius:20px;font-weight:800;font-size:10px">SALURAN</button></div>

<div class="phones">
<div class="phone mid" style="margin:auto">
<div class="topbar"><span>11:10</span><b>X-FAR</b><span>●</span></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="box dark"><div class="label">🛠️ TOOLS 36</div><div class="num">36</div></div><div class="box"><div class="label">👥 ONLINE 0</div><div class="num">0</div></div></div>
<div class="tools">
<div class="tool" onclick="openTool('leak')"><span style="font-size:20px">🧬</span><b>X-LEAK</b></div>
<div class="tool" onclick="openTool('scan')"><span style="font-size:20px">📡</span><b>X-SCAN</b></div>
<div class="tool" onclick="openTool('look')"><span style="font-size:20px">👁️</span><b>X-LOOK</b></div>
<div class="tool" onclick="openTool('bug1')"><span style="font-size:20px">🐛</span><b>BUG #01</b></div>
<div class="tool" onclick="openTool('bug2')"><span style="font-size:20px">💣</span><b>BUG #02</b></div>
<div class="tool" onclick="openTool('spam')"><span style="font-size:20px">⚡</span><b>SPAM</b></div>
</div>
</div>
</div>

<div id="popup" onclick="if(event.target==this)closePop()">
<div class="card">
<div class="head"><div class="iconBox" id="pIcon">🧬</div><div><h3 id="pTitle">X-LEAK</h3><p id="pDesc">Leak Checker Tools</p></div></div>
<div id="pBody"></div>
<div class="result" id="pResult"></div>
<button class="btn-close" onclick="closePop()">Tutup</button>
<a href="https://whatsapp.com/channel/0029VbCjEsCLNSZwGjAsEn1P" target="_blank" style="display:block;margin-top:8px;background:#ffffff18;border:1px solid #ffffff22;color:#fff;padding:10px;border-radius:12px;text-align:center;text-decoration:none;font-weight:800;font-size:11px">Join Saluran DILZNOELZ</a>
</div>
</div>

<script>
function openTool(type){
 const popup=document.getElementById('popup');
 const body=document.getElementById('pBody');
 const title=document.getElementById('pTitle');
 const desc=document.getElementById('pDesc');
 const icon=document.getElementById('pIcon');
 const res=document.getElementById('pResult');
 res.style.display='none'; res.innerHTML='';
 
 if(type=='leak'){
  title.innerText='X-LEAK'; desc.innerText='Leak Checker Tools'; icon.innerText='🧬';
  body.innerHTML=`<input class="input" id="in1" placeholder="Masukkan Nomor / Email"><button class="btn-exec" onclick="exec('Mengecek database leak...','Tidak ditemukan leak untuk data tersebut ✅')">CEK LEAK</button>`;
 } else if(type=='scan'){
  title.innerText='X-SCAN'; desc.innerText='Network Scanner - OSINT'; icon.innerText='📡';
  body.innerHTML=`<input class="input" id="in1" placeholder="Masukkan IP / Domain"><button class="btn-exec" onclick="exec('Scanning network...','Open Ports: 80,443 - Status: Aman ✅')">SCAN SEKARANG</button>`;
 } else if(type=='look'){
  title.innerText='X-LOOK'; desc.innerText='OSINT Lookup Tools'; icon.innerText='👁️';
  body.innerHTML=`<input class="input" id="in1" placeholder="Masukkan Username / Nomor"><button class="btn-exec" onclick="exec('Mencari data OSINT...','Data ditemukan di 3 sumber publik')">LOOK UP</button>`;
 } else if(type=='bug1'){
  title.innerText='X-BUG #01'; desc.innerText='Bug Tools - Edukasi'; icon.innerText='🐛';
  body.innerHTML=`<p style="font-size:11px;opacity:.7">Ini simulasi bug UI, tidak merusak HP. Untuk edukasi keamanan WA.</p><button class="btn-exec" onclick="exec('Menjalankan simulasi...','Simulasi selesai - HP Aman ✅ (Tidak Crash)')">JALANKAN SIMULASI</button>`;
 } else if(type=='bug2'){
  title.innerText='X-BUG #02'; desc.innerText='Bug Delay - Edukasi'; icon.innerText='💣';
  body.innerHTML=`<p style="font-size:11px;opacity:.7">Mode edukasi - Menampilkan cara kerja delay tanpa merusak.</p><button class="btn-exec" onclick="exec('Simulasi delay...','Simulasi Delay Selesai - Aman')">SIMULASI DELAY</button>`;
 } else if(type=='spam'){
  title.innerText='X-SPAM'; desc.innerText='Spam Protection Tools'; icon.innerText='⚡';
  body.innerHTML=`<input class="input" id="in1" placeholder="Jumlah (Max 5 - Aman)"><button class="btn-exec" onclick="exec('Anti-spam filter aktif...','Proteksi Spam Aktif ✅')">AKTIFKAN PROTEKSI</button>`;
 }
 popup.classList.add('show');
}
function exec(loadText,resultText){
 const res=document.getElementById('pResult');
 res.style.display='block';
 res.innerHTML='⏳ '+loadText;
 setTimeout(()=>{res.innerHTML='✅ '+resultText},1200);
}
function closePop(){document.getElementById('popup').classList.remove('show')}
</script>
</body>
</html>
