<div class="card" id="aimPage">
<h3 style="font-size:14px">🎯 Aim Setting • Crosshair 6D Legal + Eye 6D (FIX VIDEO)</h3>
<p style="font-size:10px;color:#a898c8;margin-top:4px">Video Eye 6D sekarang jadi animasi CSS — gak perlu file eye_6d.mp4 — langsung muncul di AppsGeyser!</p>

<div class="crosshair-preview" id="preview" style="background:radial-gradient(circle at center,#1a1030 0%,#0a0a0f 70%);position:relative;overflow:hidden;height:260px;border-radius:14px;border:1px solid rgba(140,80,255,.2);display:flex;align-items:center;justify-content:center;margin-top:8px">
<!-- EYE 6D ANIMATED - PENGGANTI VIDEO -->
<div id="eye6d" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:.9">
<div style="position:relative;width:160px;height:90px">
<!-- Mata luar -->
<div style="width:160px;height:90px;background:linear-gradient(180deg,#f5f5f5,#e0d5ff);border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;box-shadow:0 0 0 3px #1a1030,0 0 20px rgba(140,80,255,.6),inset 0 -8px 20px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;animation:blink 4s infinite">
<!-- Iris -->
<div id="iris" style="width:56px;height:56px;background:radial-gradient(circle at 30% 30%,#b78cff,#6a2cff 30%,#1a0040 70%);border-radius:50%;box-shadow:0 0 12px rgba(140,80,255,.8),inset 0 0 10px #000;display:flex;align-items:center;justify-content:center;transition:.1s">
<!-- Pupil -->
<div style="width:22px;height:22px;background:#000;border-radius:50%;box-shadow:0 0 0 4px rgba(80,0,255,.4);display:flex;align-items:center;justify-content:center">
<div style="width:8px;height:8px;background:#fff;border-radius:50%;margin:-6px 0 0 -4px;box-shadow:0 0 6px #fff"></div>
</div>
</div>
</div>
<!-- Cahaya scan -->
<div style="position:absolute;top:50%;left:-20%;width:140%;height:2px;background:linear-gradient(90deg,transparent,#8c50ff,transparent);animation:scan 2s infinite;opacity:.7"></div>
</div>
</div>

<!-- Crosshair -->
<div id="cross"></div>
<div style="position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:9px;color:#fff;background:rgba(0,0,0,.5);padding:4px 8px;border-radius:99px;z-index:3">PREVIEW 6D EYE — Drag crosshair — Tap untuk gerakin iris</div>
</div>

<label style="font-size:11px;margin-top:12px;display:block;font-weight:700">Warna Crosshair</label>
<div class="color-row" style="display:flex;gap:8px;margin-top:8px">
<button style="flex:1;padding:10px;border-radius:10px;border:none;background:#8c50ff;color:#fff;font-weight:700;font-size:12px" onclick="setColor('#8c50ff')">Purple</button>
<button style="flex:1;padding:10px;border-radius:10px;border:none;background:#ff1e4a;color:#fff;font-weight:700;font-size:12px" onclick="setColor('#ff1e4a')">Merah</button>
<button style="flex:1;padding:10px;border-radius:10px;border:none;background:#00ff88;color:#000;font-weight:700;font-size:12px" onclick="setColor('#00ff88')">Hijau</button>
<button style="flex:1;padding:10px;border-radius:10px;border:none;background:#fff;color:#000;font-weight:700;font-size:12px" onclick="setColor('#ffffff')">Putih</button>
</div>
<!-- SISA INPUT SAMA KAYAK V2 -->
<label style="font-size:11px;margin-top:12px;display:block;font-weight:700">Style</label>
<select id="styleSel" class="input" style="width:100%;padding:11px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(140,80,255,.18);color:#fff;margin-top:6px" onchange="updateCross()">
<option value="dot">Dot • Titik</option>
<option value="cross">Cross • +</option>
<option value="circle">Circle • O</option>
<option value="crossdot">Cross + Dot — Paling Sangar</option>
</select>
<label style="font-size:11px;margin-top:12px;display:block">Ukuran: <span id="sizeVal">14px</span></label>
<input type="range" id="sizeRange" min="6" max="50" value="14" class="input" style="width:100%;padding:11px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(140,80,255,.18);margin-top:6px" oninput="updateCross()">
<label style="font-size:11px;margin-top:10px;display:block">Opacity: <span id="opVal">100%</span></label>
<input type="range" id="opRange" min="20" max="100" value="100" class="input" style="width:100%;padding:11px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(140,80,255,.18);margin-top:6px" oninput="updateCross()">
<button class="btn" style="width:100%;padding:12px;border-radius:12px;background:linear-gradient(90deg,#8c50ff,#ff1e4a);border:none;color:#fff;font-weight:800;margin-top:10px" onclick="enableOverlay()">AKTIFKAN CROSSHAIR OVERLAY 💀💜</button>
<div style="height:20px"></div>
</div>
<style>
@keyframes blink{0%,90%,100%{transform:scaleY(1)}92%,94%{transform:scaleY(0.1)}}
@keyframes scan{0%{transform:translateY(-40px)}100%{transform:translateY(40px)}}
</style>
<script>
// TAMBAHAN BIAR MATA NGIKUTIN JARI
let iris=document.getElementById('iris');
document.getElementById('preview').addEventListener('touchmove',(e)=>{
let rect=e.currentTarget.getBoundingClientRect();
let x=(e.touches[0].clientX-rect.left-rect.width/2)/20;
let y=(e.touches[0].clientY-rect.top-rect.height/2)/15;
iris.style.transform=`translate(${x}px,${y}px)`;
});
</script>
